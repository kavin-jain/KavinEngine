# Speed check for non-functional changes: builds a ref with each compiler and prints interleaved bench nps
# (bench node counts must match across compilers, or the build changed the search).
name: nps
run-name: "nps ${{ inputs.ref }}"
on:
  workflow_dispatch:
    inputs:
      ref: {description: "engine commit", required: true}
      compilers: {description: "space-separated CXX list", default: "g++ clang++"}
      runs: {description: "interleaved bench runs per compiler", default: "5"}
      depth: {description: "bench depth", default: "14"}

permissions:
  contents: read

jobs:
  nps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.ref }}"}
      - name: Build
        run: |
          for c in ${{ inputs.compilers }}; do $c --version | head -1; make -s -j4 CXX=$c EXE=engine-$c; done
      - name: Bench
        run: |
          for r in $(seq ${{ inputs.runs }}); do
            for c in ${{ inputs.compilers }}; do echo "$c $(./engine-$c bench ${{ inputs.depth }} | tail -1)"; done
          done | tee bench.txt
          python3 - <<'EOF'
          import collections, statistics
          nps, nodes = collections.defaultdict(list), collections.defaultdict(set)
          for line in open("bench.txt"):
              c, n, _, v, _ = line.split()
              nps[c].append(int(v)); nodes[c].add(n)
          base = None
          for c, v in nps.items():
              m = statistics.median(v); base = base or m
              print(f"{c}: median {m:,.0f} nps ({100 * (m / base - 1):+.1f} % vs first), nodes {sorted(nodes[c])}")
          EOF
