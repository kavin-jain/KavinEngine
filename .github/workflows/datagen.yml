# Self-play training data (tools/datagen.cpp): every job runs one datagen process per core for a fixed time
# and uploads the concatenated records (zstd) to the public release data-<id>, where a GPU trainer can fetch
# them by URL. Seeds come from the run id, so reruns never repeat games.
name: datagen
run-name: "datagen ${{ inputs.id }}"
on:
  workflow_dispatch:
    inputs:
      id: {description: "dataset id (e.g. sp1)", required: true}
      ref: {description: "engine commit", required: true}
      minutes: {description: "generation time per job", default: "60"}
      nodes: {description: "search nodes per move", default: "5000"}
      jobs: {description: "JSON list of job numbers", default: "[1,2,3,4,5,6,7,8]"}

permissions:
  contents: write  # release assets

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(inputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.ref }}"}
      - name: Build
        run: make -j4 -s datagen
      - name: Generate
        run: |
          for i in $(seq 1 "$(nproc)"); do
            timeout -s INT "${{ inputs.minutes }}m" build/datagen "part$i.bin" 1000000000 \
              $(( ${{ github.run_id }} * 1000 + ${{ matrix.job }} * 10 + i )) "${{ inputs.nodes }}" 2> "gen$i.log" &
          done
          wait
          for f in part*.bin; do s=$(stat -c %s "$f"); truncate -s $(( s / 32 * 32 )) "$f"; done  # drop a torn record
          cat part*.bin > "${{ inputs.id }}-j${{ matrix.job }}.bin" && rm part*.bin
          tail -qn1 gen*.log
          zstd -q -T0 -10 --rm "${{ inputs.id }}-j${{ matrix.job }}.bin" && ls -l *.zst
      - name: Upload to release data-${{ inputs.id }}
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh release create "data-${{ inputs.id }}" --target "${{ inputs.ref }}" --title "Self-play data ${{ inputs.id }}" \
            --notes "tools/datagen.cpp output at ${{ inputs.nodes }} nodes/move (bullet ChessBoard records, zstd)." 2>/dev/null || true
          gh release upload "data-${{ inputs.id }}" *.zst --clobber
