# One SPSA round: N parallel chains (tools/spsa.py chain), each tuning the search constants from the same starting
# values for a fixed time. tools/spsa.py run merges the chains' moves, keeps the state and starts the next round.
name: spsa
run-name: "spsa ${{ inputs.id }} round ${{ inputs.round }}"
on:
  workflow_dispatch:
    inputs:
      id: {description: "tuning run id", required: true}
      round: {description: "round number", required: true}
      ref: {description: "engine commit (built with make TUNE=1)", required: true}
      state: {description: "JSON: theta, k0, chains, n_total", required: true}
      minutes: {description: "minutes per chain", default: "75"}
      pairs: {description: "game pairs per SPSA step", default: "8"}
      tc: {description: "time control", default: "8+0.08"}
      jobs: {description: "JSON list of chain numbers", default: "[1,2,3,4,5,6,7,8]"}

permissions:
  contents: read

jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(inputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.ref }}", path: dev}
      - name: Cache fastchess and book
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            fastchess-bin
            UHO_Lichess_4852_v1.epd
          key: fastchess-a281caf-release-uho-7a7f6470  # shared with sprt-batch.yml
      - name: Build fastchess (pinned) and fetch book (SHA-checked)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/Disservin/fastchess fc && git -C fc checkout -q a281caf
          make -C fc -j4 build=release > /dev/null && cp fc/fastchess fastchess-bin
          curl -sSL -o uho.zip https://github.com/official-stockfish/books/raw/master/UHO_Lichess_4852_v1.epd.zip
          python3 -m zipfile -e uho.zip .
          echo "7a7f6470615a69c6cf23d565417701d38732876f480af90d67b42abade35644a  UHO_Lichess_4852_v1.epd" | sha256sum -c -
      - name: Build the tunable engine
        run: make -C dev -j4 -s CXX=clang++ TUNE=1 EXE=engine && dev/engine bench | tail -1
      - name: SPSA chain
        env:
          STATE: ${{ inputs.state }}
          MINUTES: ${{ inputs.minutes }}
          PAIRS: ${{ inputs.pairs }}
          TC: ${{ inputs.tc }}
          ROUND: ${{ inputs.round }}
          JOB: ${{ matrix.job }}
        run: |
          python3 dev/tools/spsa.py chain --engine dev/engine --fastchess ./fastchess-bin --book UHO_Lichess_4852_v1.epd \
            --state "$STATE" --chain "$JOB" --seed $(( ROUND * 1000 + JOB )) --minutes "$MINUTES" --pairs "$PAIRS" \
            --tc "$TC" --out result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "spsa-${{ inputs.id }}-r${{ inputs.round }}-c${{ matrix.job }}"
          path: result.json
          if-no-files-found: ignore
          retention-days: 30
