; ESP32-S3 (Edgehax S3-PRO, ESP32-S3-WROOM-1-N16R8) build of the engine.
[platformio]
src_dir = ..

[env:s3]
platform = espressif32 @ 7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
extra_scripts = pre:gen_net.py
build_src_filter = +<src/> +<esp32/main.cpp> +<build/net_esp32.cpp>
build_unflags = -std=gnu++11 -Os
build_flags =
    -std=gnu++17
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DMAX_PLY=48
    -DMAX_GAME_PLY=256
    -DTT_DEFAULT_BYTES=131072
    -DTT_FAST=1
    -DBENCH_DEPTH=6
    -DNNUE_HIDDEN=128
monitor_speed = 115200
